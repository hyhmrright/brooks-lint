name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags, not just the tip: checkChangelogCoverage() derives the
          # release's commit range from the last tag, and silently skips the
          # audit on the default shallow clone.
          fetch-depth: 0
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate repository consistency
        run: node scripts/validate-repo.mjs
      - name: Install the pinned Lean kernel for proof replay
        if: matrix.node-version == 22
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y elan
          export ELAN_TOOLCHAIN="$(cat docs/research/logic-lens-009/lean-toolchain)"
          elan toolchain install "$ELAN_TOOLCHAIN"
          dirname "$(elan which lean)" >> "$GITHUB_PATH"
      - name: Replay the original deduplication cost contracts
        if: matrix.node-version == 22
        run: python3 -I docs/research/logic-lens-009/replay.py
      - name: Replay the multi-file validation failure contract
        if: matrix.node-version == 22
        run: python3 -I docs/research/logic-lens-001/replay.py
      - name: Replay Bash worker failure propagation
        if: matrix.node-version == 22
        run: python3 -I docs/research/logic-lens-002/replay.py
      - name: Unit tests
        run: npm test
      - name: Parser benchmark (frozen corpus)
        run: npm run benchmark
      - name: Structural eval suite
        run: npm run evals
      - name: Codex behavioral fixture validation (offline)
        run: npm run evals:codex:validate
