name: "Brooks-Lint Review"
description: "Run brooks-lint on PR changes and post results as a PR comment"
author: "hyhmrright"

inputs:
  mode:
    description: "CI supports review only (supplied diff); use an interactive agent for other modes"
    default: "review"
  anthropic-api-key:
    description: "Anthropic API key"
    required: true
  fail-below:
    description: "Fail the check if Health Score is below this threshold (0 = never fail)"
    default: "0"
  fail-on:
    description: "Fail the check on findings at/above this severity: none, warning, or critical"
    default: "none"
  fail-on-regression:
    description: "Fail the check if the Health Score dropped vs the last run (true/false)"
    default: "false"
  sarif-file:
    description: "Path to write a SARIF report for GitHub Code Scanning (empty = skip SARIF)"
    default: ""
  config-ref:
    description: >-
      Where to read .brooks-lint.yaml from: "base" (default — the PR's base branch,
      so a PR cannot weaken the policy that reviews it) or "head" (the checkout,
      for teams whose config file is CODEOWNERS-protected)
    default: "base"
  model:
    description: "Claude model to use"
    default: "claude-sonnet-4-6"
  api-base-url:
    description: "Anthropic-compatible /v1/messages endpoint to call instead of api.anthropic.com (empty = Anthropic)"
    default: ""
  max-tokens:
    description: "Output token ceiling for the review — truncated reports fail instead of passing quality gates (empty = ci-review.mjs default, currently 4096)"
    default: ""

outputs:
  score:
    description: "Health Score from a completed review (0-100); empty when skipped"
    value: ${{ steps.score.outputs.score }}
  skipped:
    description: "True when there was no diff to review; no quality verdict was produced"
    value: ${{ steps.score.outputs.skipped }}

branding:
  icon: "shield"
  color: "blue"

runs:
  using: "composite"
  steps:
    # Held at v4 on purpose. setup-node v5 turned on automatic npm caching
    # whenever a `packageManager` (or `devEngines.packageManager`) field names
    # npm — read from `$GITHUB_WORKSPACE/package.json`, which for a composite
    # action is the *caller's* repository, not this one. A caller that declares
    # npm without committing a lockfile would then fail inside this step with
    # "Dependencies lock file is not found". The SDK is cached explicitly below,
    # so there is nothing to gain by taking that risk on other people's repos.
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # github.action_path points at this directory (.github/actions/brooks-lint),
    # NOT at the checked-out action repository — but scripts/ and skills/ live at
    # the repo root, three levels up. Resolving the root once here is what makes
    # the paths below actually exist.
    - name: Resolve brooks-lint root
      shell: bash
      run: |
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        echo "BROOKS_LINT_ROOT=$root" >> "$GITHUB_ENV"
        # package.json is the single source of truth for the SDK version, so the
        # cache key and the install below can never pin different things.
        echo "BROOKS_LINT_SDK=$(node -p "require('$root/package.json').devDependencies['@anthropic-ai/sdk']")" >> "$GITHUB_ENV"

    - name: Cache SDK
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ env.BROOKS_LINT_ROOT }}/node_modules
        key: brooks-lint-sdk-${{ runner.os }}-${{ env.BROOKS_LINT_SDK }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm install --prefix "$BROOKS_LINT_ROOT" "@anthropic-ai/sdk@$BROOKS_LINT_SDK"

    - name: Run Brooks-Lint
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        API_BASE_URL: ${{ inputs.api-base-url }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        MODE: ${{ inputs.mode }}
        MODEL: ${{ inputs.model }}
        CONFIG_REF: ${{ inputs.config-ref }}
        MAX_TOKENS: ${{ inputs.max-tokens }}
      run: |
        # Validated here as well as in the script so a typo fails before the API
        # call is paid for. Matched as a shell value, never interpolated into the
        # body — see the Check Threshold step for why.
        case "$CONFIG_REF" in
          base|head) ;;
          *)
            echo "config-ref must be 'base' or 'head' (got: $CONFIG_REF)"
            exit 1
            ;;
        esac
        # Exported only when the input is set: naming ANTHROPIC_BASE_URL in the
        # env block above would blank out one inherited from the job env. The
        # SDK reads the variable itself, so nothing downstream needs a flag.
        if [ -n "$API_BASE_URL" ]; then
          export ANTHROPIC_BASE_URL="$API_BASE_URL"
        fi
        sarif_arg=()
        if [ -n "$SARIF_FILE" ]; then
          sarif_arg=(--sarif-out "$SARIF_FILE")
        fi
        # Passed only when the input is set, so the ceiling keeps exactly one
        # source of truth: DEFAULT_MAX_TOKENS in scripts/cli-utils.mjs. Giving
        # this input its own numeric default here would be a second copy of the
        # number that could drift from the script's.
        max_tokens_arg=()
        if [ -n "$MAX_TOKENS" ]; then
          max_tokens_arg=(--max-tokens "$MAX_TOKENS")
        fi
        node "$BROOKS_LINT_ROOT/scripts/ci-review.mjs" \
          --mode "$MODE" \
          --model "$MODEL" \
          --skills-dir "$BROOKS_LINT_ROOT/skills" \
          --project-dir "$GITHUB_WORKSPACE" \
          --config-ref "$CONFIG_REF" \
          "${sarif_arg[@]}" \
          "${max_tokens_arg[@]}" \
          > brooks-lint-report.json

    - name: Parse Health Score
      shell: bash
      id: score
      run: |
        score=$(node --input-type=module -e "
          import { readFileSync } from 'fs';
          const r = JSON.parse(readFileSync('brooks-lint-report.json', 'utf8'));
          if (r.status === 'skipped') console.log('');
          else if (r.status !== 'complete' || !Number.isInteger(r.score) || r.score < 0 || r.score > 100) process.exit(1);
          else console.log(r.score);
        ")
        echo "score=$score" >> "$GITHUB_OUTPUT"
        if [ -z "$score" ]; then
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          echo "No diff to review — skipped without a score or quality verdict."
        else
          echo "skipped=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Post PR Comment
      if: github.event_name == 'pull_request' && steps.score.outputs.skipped != 'true'
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('brooks-lint-report.json', 'utf8'));
          const trend = r.trend ? `\n\n**Trend:** ${r.trend}` : '';
          // The report was cut off at the output ceiling, so the score above is
          // too high — a reviewer reading the comment has to be told, not just
          // whoever opens the run's annotations. The wording is imported from
          // the module that writes the annotation rather than restated here, so
          // the comment and the annotation cannot disagree. cli-utils.mjs is
          // ESM, which is why this is import() and not require().
          let truncation = '';
          if (r.truncated) {
            const { pathToFileURL } = require('url');
            const url = pathToFileURL(`${process.env.BROOKS_LINT_ROOT}/scripts/cli-utils.mjs`).href;
            const { TRUNCATION_NOTICE } = await import(url);
            truncation = `\n\n> [!WARNING]\n> ${TRUNCATION_NOTICE}`;
          }
          const body = `## Brooks-Lint Review\n\n${r.report}${trend}${truncation}\n\n---\n_Automated by [brooks-lint](https://github.com/hyhmrright/brooks-lint)_`;
          await github.rest.issues.createComment({
            ...context.repo,
            issue_number: context.issue.number,
            body
          });

    - name: Upload SARIF
      if: inputs.sarif-file != '' && steps.score.outputs.skipped != 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}

    # Inputs go through env, never straight into the script body: a caller wiring
    # an input to attacker-controlled text (a PR title, a branch name) would
    # otherwise be injecting shell here. Same reason as the Run step above.
    - name: Check Threshold
      if: inputs.fail-below != '0' && steps.score.outputs.skipped != 'true'
      shell: bash
      env:
        SCORE: ${{ steps.score.outputs.score }}
        FAIL_BELOW: ${{ inputs.fail-below }}
      run: |
        if [ "$SCORE" -lt "$FAIL_BELOW" ]; then
          echo "Health Score $SCORE is below threshold $FAIL_BELOW"
          exit 1
        fi

    - name: Quality Gates
      if: steps.score.outputs.skipped != 'true' && (inputs.fail-on != 'none' || inputs.fail-on-regression == 'true')
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: |
        node "$BROOKS_LINT_ROOT/scripts/ci-gate.mjs" \
          --report brooks-lint-report.json \
          --fail-on "$FAIL_ON" \
          --fail-on-regression "$FAIL_ON_REGRESSION"
